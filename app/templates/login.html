{% extends "base.html" %}
{% block title %}Login · Kittylol{% endblock %}
{% block body %}
<div class="auth-page"><form class="auth-card" method="post" action="/login"><a class="logo" href="/"><b>K</b> KITTYLOL</a><h1>Welcome back</h1><p>Sign in to your control panel.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-light wide">Sign in</button></form></div>
{% endblock %}
